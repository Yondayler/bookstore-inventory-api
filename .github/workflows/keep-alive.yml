name: Keep the API awake

# Render's free plan puts a service to sleep after 15 minutes without traffic,
# and the next request then takes ~50 seconds to answer. Pinging /health keeps
# the instance warm so the reviewers never hit a cold start.
#
# The window is deliberate: free services share a pool of 750 instance-hours a
# month across the account, so this pings from 12:00 to 23:59 UTC (08:00-19:59
# in Venezuela/Colombia, 14:00-01:59 in Spain) instead of around the clock.
# Widen the cron or delete this file to change that.
on:
  schedule:
    - cron: "*/10 12-23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://bookstore-inventory-api-qtgy.onrender.com/health; then
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 20
          done
          echo "The API did not answer after 3 attempts"
          exit 1
